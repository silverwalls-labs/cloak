# Stack decisions (S1 — 2026-09-06):
#   CLI arg-parsing:  clap (derive) — industry standard, derive macros, excellent errors
#   Error handling:   thiserror (core) + anyhow (CLI) — typed lib errors, ergonomic CLI
#   CI provider:      GitHub Actions — native to repo, free ARM runners for public repos
#   MSRV:             1.98.1 — latest stable at time of implementation, edition 2024
# Stack decisions (S2 — 2026-09-07):
#   Prefilter:        aho-corasick — one automaton over all rules' anchors, SIMD inside
#   Confirm:          regex-automata dense DFA — anchored, byte-oriented, minimal features
#                     (unicode/meta/hybrid/perf OFF: confirm runs rarely over ≤266-byte
#                     windows; revisit perf-inline with bench receipts in S7)

[workspace]
resolver = "3"
members = ["crates/cloak-core", "crates/cloak-cli", "crates/cloak-wasm", "crates/wasm-parity", "crates/bench-gate"]
# The fuzz crate is deliberately outside the workspace (standard cargo-fuzz
# layout): it needs the nightly toolchain + libFuzzer link flags and must not
# drag libfuzzer-sys into cargo-deny/workspace builds. CI runs fmt/clippy on
# it separately via --manifest-path.
exclude = ["crates/cloak-core/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/silverwalls-labs/cloak"

[workspace.dependencies]
aho-corasick = "1.1"
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "dfa-build"] }
blake3 = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
crc32fast = "1"
criterion = "0.5"
insta = { version = "1", features = ["json"] }
rand = "0.9"
tempfile = "3"
proptest = "1"
wasmtime = "49"
wasmtime-wasi = { version = "49", features = ["p1"] }

# WASM panic containment: cloak-wasm's catch_unwind boundary handlers
# require unwinding — under panic=abort they would be dead code and any
# panic would trap the whole instance. Explicit (the current default on
# every workspace target) so a future toolchain or profile change
# cannot silently flip the strategy.
[profile.release]
panic = "unwind"
