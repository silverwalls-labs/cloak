# cloak as a k8s log processor. A sidecar CANNOT intercept another
# container's stdout — the kubelet captures it first. So either redact
# inside the container (Pattern A) or tail a shared log file (Pattern B).
# Images are placeholders: no cloak image is published in v0.1 — build one
# with the Dockerfile in examples/README.md.
---
apiVersion: v1
kind: Secret
metadata:
  name: cloak-digest-key
type: Opaque
stringData:
  # generate a real key (openssl rand -hex 32) — a copied literal key lets
  # anyone confirm guessed secrets against your tags. Same key fleet-wide
  # => fleet-wide correlation.
  key: "REPLACE_ME"
---
# Pattern A: wrap the app command — redacted before the kubelet captures it.
# The collector scrapes this container's stdout as usual.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-inline-cloak
spec:
  replicas: 1
  selector:
    matchLabels: { app: app-inline-cloak }
  template:
    metadata:
      labels: { app: app-inline-cloak }
    spec:
      containers:
        - name: app
          image: your-registry/your-app:latest # must contain the cloak binary
          command: ["/bin/sh", "-c"]
          args: ["/usr/local/bin/app 2>&1 | cloak"]
          env:
            - name: CLOAK_DIGEST_KEY
              valueFrom:
                secretKeyRef: { name: cloak-digest-key, key: key }
          securityContext:
            allowPrivilegeEscalation: false
---
# Pattern B: app logs to an emptyDir file; the sidecar's stdout is the
# redacted stream — point the node collector at the SIDECAR, not the app.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-cloak-sidecar
spec:
  replicas: 1
  selector:
    matchLabels: { app: app-cloak-sidecar }
  template:
    metadata:
      labels: { app: app-cloak-sidecar }
    spec:
      containers:
        - name: app
          image: your-registry/your-app:latest # logs to /var/log/app/app.log, not stdout
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - { name: logs, mountPath: /var/log/app }
        - name: cloak
          image: your-registry/cloak:0.1.0 # examples/README.md Dockerfile
          command: ["/bin/sh", "-c"]
          # -n +1: whole file, not just new lines; -F: survive rotation
          args: ["tail -n +1 -F /var/log/app/app.log | cloak"]
          env:
            - name: CLOAK_DIGEST_KEY
              valueFrom:
                secretKeyRef: { name: cloak-digest-key, key: key }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: logs, mountPath: /var/log/app, readOnly: true }
      volumes:
        - name: logs
          emptyDir: {}
