# cargo-deny configuration for cloak
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    # target-lexicon (via pyo3-build-config); the LLVM exception only
    # relaxes Apache-2.0's attribution terms for binary redistribution.
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
