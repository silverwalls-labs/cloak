# Exclude test vectors and specific test files from GitHub secret scanning.
# Cloak is a secrets redaction tool — test vectors contain synthetic tokens
# with valid checksums (CRC32) that are intentionally crafted to match
# real token formats. These are NOT real credentials.
# real_token_corpus.rs contains hex-encoded expired tokens (verified revoked
# 2026-09-11) needed to pin external format assumptions.
# cloak-cli e2e tests reuse the same synthetic checksum-valid fixtures
# (e.g. ghp_AbCd…2piBxe) as the unit vectors — format-validation
# material only, never issued credentials.
paths-ignore:
  - "crates/cloak-core/src/rules/vectors/**"
  - "crates/cloak-core/tests/real_token_corpus.rs"
  - "crates/cloak-cli/tests/**"
