name: Quality Gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Static analysis ──────────────────────────────────────────────

  format:
    name: Format
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03
        with:
          toolchain: 1.98.1
          components: rustfmt

      - name: Format
        run: |
          cargo fmt --all -- --check
          # The fuzz crate is workspace-excluded — check it explicitly.
          cargo fmt --manifest-path crates/cloak-core/fuzz/Cargo.toml -- --check

  lint:
    name: Lint
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03
        with:
          toolchain: 1.98.1
          components: clippy

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          # The fuzz crate is workspace-excluded — lint it explicitly
          # (check-only: no libFuzzer link, works on stable).
          cargo clippy --manifest-path crates/cloak-core/fuzz/Cargo.toml --all-targets -- -D warnings

  # ── Build ────────────────────────────────────────────────────────

  # Test jobs run on both Linux ISAs: x86-64 and aarch64 take different
  # SIMD paths inside aho-corasick/regex-automata — cross-target divergence
  # is asserted absent (docs/03). macOS runners deferred (ledger F14).
  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03
        with:
          toolchain: 1.98.1

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build
        run: |
          cargo build --workspace

  # ── Tests ─────────────────────────────────────────────────────────

  unit-tests:
    name: Unit Tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03
        with:
          toolchain: 1.98.1

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Unit Tests
        run: |
          cargo test --workspace --lib
          cargo test --workspace --doc

  integration-tests:
    name: Integration Tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03
        with:
          toolchain: 1.98.1

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Integration Tests
        run: |
          # Glob (quoted, cargo-side) runs every integration test target —
          # new test files are picked up without editing this workflow.
          cargo test -p cloak-core --test '*'

  e2e-tests:
    name: E2E Tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03
        with:
          toolchain: 1.98.1

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: E2E Tests
        run: |
          # Glob (quoted, cargo-side) — new e2e files are picked up
          # without editing this workflow (matches integration job).
          cargo test -p cloak-cli --test '*'

  fuzz:
    name: Fuzz — replay + smoke
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      # rust-toolchain.toml pins stable — cargo-fuzz needs nightly.
      # Pin bump policy: when cargo-fuzz requires it or monthly.
      RUSTUP_TOOLCHAIN: nightly-2026-09-05

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust (nightly — libFuzzer instrumentation)
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03
        with:
          toolchain: nightly-2026-09-05

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/cloak-core/fuzz

      - name: Install cargo-fuzz
        run: |
          cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Corpus regression replay
        working-directory: crates/cloak-core
        run: |
          # Every committed input re-executed with the default-mode harness
          # assertions (no panic + carry-over bound) — no fuzzing. The
          # correctness-equivalence assertions are strict-only; the
          # regression-* reproducers for #27/#34 therefore only guard
          # no-panic here, and their invariants are pinned instead by the
          # (currently #[ignore]d) tests in tests/differential.rs. Set
          # CLOAK_FUZZ_STRICT=1 to replay them with full equivalence checks
          # once those bugs are fixed.
          for t in fuzz_engine_stream fuzz_pem_state fuzz_config; do
            cargo fuzz run "$t" "fuzz/corpus/$t" -O --debug-assertions -- -runs=0 -timeout=10
          done

      - name: Fuzz smoke (time-boxed)
        working-directory: crates/cloak-core
        run: |
          cargo fuzz run fuzz_engine_stream fuzz/corpus/fuzz_engine_stream -O --debug-assertions -- \
            -max_total_time=90 -timeout=10 -rss_limit_mb=2048 -max_len=32768 \
            -dict=fuzz/dictionaries/engine_stream.dict
          cargo fuzz run fuzz_pem_state fuzz/corpus/fuzz_pem_state -O --debug-assertions -- \
            -max_total_time=90 -timeout=10 -rss_limit_mb=2048 -max_len=32768 \
            -dict=fuzz/dictionaries/pem_state.dict
          cargo fuzz run fuzz_config fuzz/corpus/fuzz_config -O --debug-assertions -- \
            -max_total_time=60 -timeout=10 -max_len=4096 -close_fd_mask=3 \
            -dict=fuzz/dictionaries/config.dict

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.os }}
          path: crates/cloak-core/fuzz/artifacts/
          if-no-files-found: ignore

  smoke:
    name: Smoke
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03
        with:
          toolchain: 1.98.1

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Smoke — golden pipe
        run: |
          cargo build --bin cloak
          echo "hello world" | ./target/debug/cloak | diff - <(echo "hello world")

      - name: Smoke — golden redaction
        run: |
          # Golden pinned by `smoke_golden_redaction` in cloak-core's
          # tests/rules.rs — digest drift fails tests before it fails here.
          in='token=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 done'
          want='token=[CLOAK:github-token:c122] done'
          out=$(printf '%s\n' "$in" | CLOAK_DIGEST_KEY=smoke-test-key ./target/debug/cloak)
          [ "$out" = "$want" ]

  # ── Coverage (single platform, instrumented) ─────────────────────
  # cargo-llvm-cov captures subprocess coverage (verified: e2e reports
  # main.rs coverage via instrumented binary + inherited LLVM_PROFILE_FILE).

  coverage-unit:
    name: Coverage — Unit
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03
        with:
          toolchain: 1.98.1
          components: llvm-tools

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-llvm-cov
        run: |
          cargo install cargo-llvm-cov --version 0.9.1 --locked

      - name: Unit Tests with Coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --lib --lcov --output-path coverage/unit.lcov

      - name: Upload Coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unit
          path: coverage/unit.lcov

  coverage-integration:
    name: Coverage — Integration
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03
        with:
          toolchain: 1.98.1
          components: llvm-tools

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-llvm-cov
        run: |
          cargo install cargo-llvm-cov --version 0.9.1 --locked

      - name: Integration Tests with Coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov -p cloak-core --test '*' --lcov --output-path coverage/integration.lcov

      - name: Upload Coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-integration
          path: coverage/integration.lcov

  coverage-e2e:
    name: Coverage — E2E
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03
        with:
          toolchain: 1.98.1
          components: llvm-tools

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-llvm-cov
        run: |
          cargo install cargo-llvm-cov --version 0.9.1 --locked

      - name: E2E Tests with Coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov -p cloak-cli --test '*' --lcov --output-path coverage/e2e.lcov

      - name: Upload Coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-e2e
          path: coverage/e2e.lcov

  coverage-smoke:
    name: Coverage — Smoke (placeholder)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Coverage — Smoke
        run: |
          echo "smoke: coverage not applicable — golden pipe check only"

  # ── Coverage aggregation ─────────────────────────────────────────
  # No coverage-fuzz job: the fuzz tier is gated by the Fuzz job itself
  # (corpus replay + time-boxed smoke); measuring replay coverage would
  # need nightly `cargo fuzz coverage` plumbing for corpus that is the
  # vector suite — already covered by the integration tier.

  coverage-report:
    name: Coverage Report
    needs:
      - coverage-unit
      - coverage-integration
      - coverage-e2e
      - coverage-smoke
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Download coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true
          path: coverage

      - name: Generate coverage report and enforce thresholds
        run: |
          # ── Coverage thresholds (line coverage %) ──
          # Raised in S6 after the gap-fill (measured: unit 98.1, integration
          # 94.7, e2e 98.7, total ~96.9). Rule: floor(measured) − 2, except
          # e2e which keeps extra margin — its ~80-line denominator makes a
          # single uncovered line worth >1%.
          THRESHOLD_UNIT=96
          THRESHOLD_INTEGRATION=92
          THRESHOLD_E2E=90
          THRESHOLD_TOTAL=94

          # Parse an LCOV file → "lines% funcs% branches% lines_raw"
          parse_lcov() {
            local file="$1"
            local lf=0 lh=0 fnf=0 fnh=0 brf=0 brh=0
            if [ ! -f "$file" ]; then
              echo "- - - 0"
              return
            fi
            while IFS= read -r line; do
              case "$line" in
                LF:*) lf=$((lf + ${line#LF:})) ;;
                LH:*) lh=$((lh + ${line#LH:})) ;;
                FNF:*) fnf=$((fnf + ${line#FNF:})) ;;
                FNH:*) fnh=$((fnh + ${line#FNH:})) ;;
                BRF:*) brf=$((brf + ${line#BRF:})) ;;
                BRH:*) brh=$((brh + ${line#BRH:})) ;;
              esac
            done < "$file"
            local lpct="-" fpct="-" bpct="-" lraw="0"
            if [ "$lf" -gt 0 ]; then
              lraw=$(awk "BEGIN { printf \"%.1f\", ($lh/$lf)*100 }")
              lpct="${lraw}%"
            fi
            [ "$fnf" -gt 0 ] && fpct=$(awk "BEGIN { printf \"%.1f%%\", ($fnh/$fnf)*100 }")
            [ "$brf" -gt 0 ] && bpct=$(awk "BEGIN { printf \"%.1f%%\", ($brh/$brf)*100 }")
            echo "$lpct $fpct $bpct $lraw"
          }

          # ── Per-tier parsing ──
          read -r unit_l unit_f unit_b unit_raw <<< "$(parse_lcov coverage/unit.lcov)"
          read -r integ_l integ_f integ_b integ_raw <<< "$(parse_lcov coverage/integration.lcov)"
          read -r e2e_l e2e_f e2e_b e2e_raw <<< "$(parse_lcov coverage/e2e.lcov)"

          # ── Total (merge all LCOV files) ──
          total_lf=0 total_lh=0 total_fnf=0 total_fnh=0 total_brf=0 total_brh=0
          for f in coverage/*.lcov; do
            [ -f "$f" ] || continue
            while IFS= read -r line; do
              case "$line" in
                LF:*) total_lf=$((total_lf + ${line#LF:})) ;;
                LH:*) total_lh=$((total_lh + ${line#LH:})) ;;
                FNF:*) total_fnf=$((total_fnf + ${line#FNF:})) ;;
                FNH:*) total_fnh=$((total_fnh + ${line#FNH:})) ;;
                BRF:*) total_brf=$((total_brf + ${line#BRF:})) ;;
                BRH:*) total_brh=$((total_brh + ${line#BRH:})) ;;
              esac
            done < "$f"
          done
          total_lpct="-"; total_fpct="-"; total_bpct="-"; total_raw="0"
          if [ "$total_lf" -gt 0 ]; then
            total_raw=$(awk "BEGIN { printf \"%.1f\", ($total_lh/$total_lf)*100 }")
            total_lpct="${total_raw}%"
          fi
          [ "$total_fnf" -gt 0 ] && total_fpct=$(awk "BEGIN { printf \"%.1f%%\", ($total_fnh/$total_fnf)*100 }")
          [ "$total_brf" -gt 0 ] && total_bpct=$(awk "BEGIN { printf \"%.1f%%\", ($total_brh/$total_brf)*100 }")

          # ── Threshold check (exit code, not subshell) ──
          FAILED=0
          check_threshold() {
            local name="$1" actual="$2" required="$3"
            if awk "BEGIN { exit ($actual >= $required) ? 0 : 1 }"; then
              echo "✅"
            else
              echo "❌"
              return 1
            fi
          }

          unit_status=$(check_threshold "unit" "$unit_raw" "$THRESHOLD_UNIT") || FAILED=1
          integ_status=$(check_threshold "integration" "$integ_raw" "$THRESHOLD_INTEGRATION") || FAILED=1
          e2e_status=$(check_threshold "e2e" "$e2e_raw" "$THRESHOLD_E2E") || FAILED=1
          total_status=$(check_threshold "total" "$total_raw" "$THRESHOLD_TOTAL") || FAILED=1

          # ── Build markdown report ──
          {
            echo "<!-- cloak-coverage-report -->"
            echo "## Coverage Report"
            echo ""
            echo "| Category | Lines | Functions | Branches | Threshold | Status |"
            echo "|----------|-------|-----------|----------|-----------|--------|"
            echo "| unit | ${unit_l} | ${unit_f} | ${unit_b} | ≥${THRESHOLD_UNIT}% | ${unit_status} |"
            echo "| integration | ${integ_l} | ${integ_f} | ${integ_b} | ≥${THRESHOLD_INTEGRATION}% | ${integ_status} |"
            echo "| e2e | ${e2e_l} | ${e2e_f} | ${e2e_b} | ≥${THRESHOLD_E2E}% | ${e2e_status} |"
            echo "| smoke | - | - | - | — | — |"
            echo "| fuzz | replay + smoke | - | - | gated in Fuzz job | — |"
            echo "| **Total** | **${total_lpct}** | **${total_fpct}** | **${total_bpct}** | **≥${THRESHOLD_TOTAL}%** | **${total_status}** |"
          } > coverage/report.md

          cat coverage/report.md

          # ── Fail if any threshold breached ──
          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "::error::Coverage below threshold. See table above."
            exit 1
          fi

      - name: Post coverage comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPORT=$(cat coverage/report.md)
          PR_NUMBER=${{ github.event.pull_request.number }}
          COMMENT_TAG="<!-- cloak-coverage-report -->"

          # Find existing coverage comment
          COMMENT_ID=$(gh api \
            "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | startswith(\"${COMMENT_TAG}\")) | .id" \
            2>/dev/null | head -1)

          if [ -n "$COMMENT_ID" ]; then
            gh api \
              "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" \
              -X PATCH \
              -f body="$REPORT"
          else
            gh api \
              "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              -f body="$REPORT"
          fi

  # ── Supply chain ─────────────────────────────────────────────────

  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03
        with:
          toolchain: 1.98.1

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-deny
        run: |
          cargo install cargo-deny --version 0.20.2 --locked

      - name: cargo-deny
        run: |
          cargo deny check advisories licenses bans sources
