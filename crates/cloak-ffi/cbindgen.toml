# cbindgen config for the committed C header (include/cloak.h).
#
# The header is generated manually with the cbindgen CLI and committed;
# CI regenerates and diffs it (same freshness convention as the
# vectors.json fixtures). cbindgen is NOT a build-dependency: as one it
# would drag a syn/serde-derive tree into every workspace build and into
# cargo-deny scope, and regenerate the header nondeterministically per
# toolchain.
language = "C"
include_guard = "CLOAK_H"
cpp_compat = true
documentation = true
usize_is_size_t = true
header = """/* cloak C ABI — generated by cbindgen from crates/cloak-ffi.
 * Regenerate:
 *   cbindgen --config crates/cloak-ffi/cbindgen.toml --crate cloak-ffi \\
 *       --output crates/cloak-ffi/include/cloak.h
 * DO NOT EDIT BY HAND — CI diffs this file (and its vendored twin at
 * crates/cloak-go/include/cloak.h) against a fresh generation. */"""

[export]
include = ["CloakBuf", "CloakEngine", "CloakSession"]
